name: "🐛 Bug Report"
description: "Report NxNative Launcher issues, controller glitches, porting wizard errors, or crashes when launching games."
title: "[Bug]: "
labels: ["launcher-bug", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve **NxNative Launcher**! 
        Please fill out the form below with as much detail as possible to help us reproduce and fix the issue.

        > [!CAUTION]
        > **CLEAN-ROOM & COPYRIGHT POLICY:**
        > **NEVER** attach cryptographic keys (`prod.keys`, `title.keys`), ROMs, NSPs, XCIs, DLCs, or proprietary data extracted from games. Attach only plain text logs and screenshots.

  - type: dropdown
    id: category
    attributes:
      label: "Problem Category"
      description: "Select the area of NxNative Launcher where the error occurs."
      options:
        - "Launcher Graphical Interface (UI / Windows / Carousel)"
        - "Controller / Gamepad Navigation (Switch Pro, Xbox, PS4/PS5, Joy-Cons)"
        - "Porting Wizard (NSP/XCI Import / Compilation)"
        - "DLC, Update & Save Detection"
        - "Game Launch Failure (Immediate crash / Black screen)"
        - "Visual Glitches / MetalFX / Shaders"
        - "Audio / Sound Effect Issues"
        - "Other Issue"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: "Apple Silicon Processor"
      description: "Which chip powers your Mac or Apple device?"
      options:
        - "Apple M1 / M1 Pro / M1 Max / M1 Ultra"
        - "Apple M2 / M2 Pro / M2 Max / M2 Ultra"
        - "Apple M3 / M3 Pro / M3 Max"
        - "Apple M4 / M4 Pro / M4 Max"
        - "Apple A17 Pro / A18 / A18 Pro (iPhone / iPad)"
        - "Other"
    validations:
      required: true

  - type: input
    id: mac_model
    attributes:
      label: "Mac Model & RAM"
      placeholder: "e.g., MacBook Pro 16\" M2 Max, 32GB RAM"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: "macOS / iOS Version"
      placeholder: "e.g., macOS 15.1 Sequoia (or macOS 14.5 Sonoma)"
    validations:
      required: true

  - type: input
    id: launcher_version
    attributes:
      label: "NxNative Launcher Version"
      placeholder: "e.g., v1.0.0 or git commit (e.g., 51d6e8a)"
    validations:
      required: false

  - type: input
    id: game_info
    attributes:
      label: "Game & Title ID (if applicable)"
      description: "Game name, Title ID (16 hex digits), update version, and whether DLC is installed."
      placeholder: "e.g., The Legend of Zelda: Breath of the Wild (01007EF00011E000) v1.6.0 + DLC"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "What happened? (Bug Description)"
      description: "Clearly describe the unexpected behavior you encountered."
      placeholder: "When clicking 'Play' or attempting to port the NSP file, the screen freezes at..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce this behavior?"
      placeholder: |
        1. Open NxNative Launcher
        2. Connect Xbox controller via Bluetooth
        3. Navigate to Compatible Games tab
        4. Click on...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "The game should launch in full screen with controls mapped..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Execution Logs (Console / Crash Log)"
      description: |
        Attach or paste relevant error logs:
        - **Ported game logs on Mac:** `~/Library/Logs/nxnative/<TitleID>.log`
        - **Previous session log:** `~/Library/Logs/nxnative/<TitleID>.prev.log`
        - **Launcher logs:** Terminal console output if executed via `.command`.
      placeholder: "Paste log lines with [RED], panic, fatal error, or stack traces..."
    validations:
      required: false

  - type: checkboxes
    id: clean_room_confirmation
    attributes:
      label: "Legal Compliance Confirmation"
      options:
        - label: "I confirm that NO proprietary files (prod.keys, ROMs, NSPs, or copyrighted code) are attached to this ticket."
          required: true

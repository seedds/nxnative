name: "💡 Feature Request"
description: "Suggest new features, UI improvements, or capabilities for NxNative Launcher."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping evolve **NxNative Launcher**!
        Please describe your idea or improvement below.

  - type: dropdown
    id: area
    attributes:
      label: "Area of Interest"
      options:
        - "Launcher Interface (UI / UX / Styling)"
        - "Controller Support & Button Mapping"
        - "Porting Wizard"
        - "Save & Configuration Manager"
        - "macOS Integration (Shortcuts, Spotlight, Notifications)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "What need or problem are you trying to solve?"
      description: "A clear explanation of what is missing or how the current workflow can be improved."
      placeholder: "Currently, when doing..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "How do you envision this feature working in practice?"
      placeholder: "It would be great if there was a button in the toolbar to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Did you consider any alternative solutions or workarounds?"
    validations:
      required: false

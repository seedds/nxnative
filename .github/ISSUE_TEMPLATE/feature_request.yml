name: "💡 Sugestão de Melhoria (Feature Request)"
description: "Sugira novas funcionalidades, melhorias na interface ou recursos para o NxNative Launcher."
title: "[Sugestão]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a evoluir o **NxNative Launcher**!
        Descreva sua ideia ou melhoria abaixo.

  - type: dropdown
    id: area
    attributes:
      label: "Área de Interesse"
      options:
        - "Interface do Launcher (UI / UX / Estilização)"
        - "Suporte a Controles & Mapeamento de Botões"
        - "Assistente de Portabilidade (Porting Wizard)"
        - "Gerenciador de Saves e Configurações"
        - "Integração com macOS (Atalhos, Spotlight, Notificações)"
        - "Outro"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Qual necessidade ou problema você quer resolver?"
      description: "Uma explicação clara do que está faltando ou como o fluxo de uso atual pode ser melhorado."
      placeholder: "Atualmente, ao fazer..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Solução Proposta"
      description: "Como você imagina que essa funcionalidade deveria funcionar na prática?"
      placeholder: "Seria excelente se houvesse um botão na barra de ferramentas para..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternativas Consideradas"
      description: "Você considerou alguma alternativa ou solução de contorno?"
    validations:
      required: false

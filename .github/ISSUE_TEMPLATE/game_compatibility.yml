name: "🎮 Game Compatibility Report"
description: "Submit a compatibility test report for a game running via NxNative Launcher on Apple Silicon."
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Help map Nintendo Switch game compatibility running natively on Mac / Apple Silicon!
        Fill out the fields below with your test results.

  - type: input
    id: game_name
    attributes:
      label: "Game Name"
      placeholder: "e.g., Super Mario Odyssey"
    validations:
      required: true

  - type: input
    id: title_id
    attributes:
      label: "Title ID (16 hexadecimal digits)"
      placeholder: "e.g., 0100000000010000"
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: "Game Version & Installed DLCs"
      placeholder: "e.g., v1.3.0 (v196608) / No DLC"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: "Overall Playability Status"
      description: "Rate the current playability of this title."
      options:
        - "🟢 Perfect (Stable 60 FPS, no audio or video glitches)"
        - "🟡 Playable (Fully playable from start to finish with minor drops or small glitches)"
        - "🟠 Boots into Game (Loads menu and early gameplay, but freezes or crashes later)"
        - "🔴 Incompatible / Crash (Crashes on boot, persistent black screen, or shader failure)"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: "Mac Processor"
      options:
        - "Apple M1 / M1 Pro / M1 Max / M1 Ultra"
        - "Apple M2 / M2 Pro / M2 Max / M2 Ultra"
        - "Apple M3 / M3 Pro / M3 Max"
        - "Apple M4 / M4 Pro / M4 Max"
        - "iOS / iPadOS (A17 Pro / M2 iPad)"
    validations:
      required: true

  - type: input
    id: ram_and_os
    attributes:
      label: "RAM & macOS Version"
      placeholder: "e.g., 16 GB RAM - macOS 15.1 Sequoia"
    validations:
      required: true

  - type: checkboxes
    id: settings_used
    attributes:
      label: "Settings Enabled in NxNative Launcher"
      options:
        - label: "Unlock 60 FPS"
        - label: "Docked Mode (1080p)"
        - label: "MetalFX Spatial Upscaling"
        - label: "Metal Performance HUD enabled"

  - type: input
    id: controller
    attributes:
      label: "Controller Used"
      placeholder: "e.g., Nintendo Switch Pro Controller (Bluetooth) / Xbox Wireless / PS5 DualSense"
    validations:
      required: false

  - type: textarea
    id: observations
    attributes:
      label: "Additional Observations & Tips"
      description: "Mention observed frame rates, thermals, any special flags required in env.txt, or tips for other players."
      placeholder: "The game runs at a locked 60 FPS at 1080p, with an average VRAM usage of 4GB..."
    validations:
      required: false

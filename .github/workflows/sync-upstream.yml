name: Sync Upstream (seedds/nxnative)

on:
  schedule:
    # Automatically sync every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  # Allow manual trigger via GitHub Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate merge without pushing (Dry Run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync with seedds/nxnative
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/seedds/nxnative.git || git remote set-url upstream https://github.com/seedds/nxnative.git
          git fetch upstream main

      - name: Check for New Upstream Commits
        id: check_diff
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "New upstream commits: $BEHIND"
          if [ "$BEHIND" -gt 0 ]; then
            echo "Latest upstream commits to incorporate:"
            git log HEAD..upstream/main --oneline -n 10
          else
            echo "Fork is already fully up to date with upstream/main."
          fi

      - name: Execute Safe Merge (Preserving Customizations)
        id: do_merge
        if: steps.check_diff.outputs.behind > 0
        run: |
          echo "Attempting to merge upstream/main into main branch..."
          # Standard merge preserving local launcher commits
          if git merge upstream/main --no-edit -m "chore(sync): merge upstream updates from seedds/nxnative"; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "✅ Merge completed successfully without conflicts!"
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "⚠️ Merge conflict detected!"
            # Abort immediately to NOT corrupt or break main branch
            git merge --abort
          fi

      - name: Push Updates to Main
        if: steps.check_diff.outputs.behind > 0 && steps.do_merge.outputs.has_conflicts == 'false' && (!inputs.dry_run)
        run: |
          echo "Pushing newly merged commits to fork main branch..."
          git push origin main
          echo "🎉 Fork successfully updated!"

      - name: Safely Alert Conflicts (Without Breaking Main)
        if: steps.check_diff.outputs.behind > 0 && steps.do_merge.outputs.has_conflicts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="upstream-sync-review-${{ github.run_id }}"
          echo "Creating isolated review branch: $BRANCH_NAME..."
          git checkout -b "$BRANCH_NAME"
          # Run attempt on isolated branch to record where conflicts lie
          git merge upstream/main --no-edit || true
          git push origin "$BRANCH_NAME" || true

          ALERT_BODY=$(cat <<'EOF'
          ## ⚠️ Conflict Detected during Automated Upstream Synchronization

          The automated sync workflow attempted to merge new commits from `seedds/nxnative:main`, but encountered **merge conflicts** with custom files in **NxNative Launcher**.

          > [!IMPORTANT]
          > **Your `main` branch is protected and was NOT modified or corrupted.** All existing functionality remains safe and operational.

          A temporary review branch has been created: `${{ env.BRANCH_NAME }}`.

          ### How to resolve manually in your local terminal:
          ```bash
          cd nxnative
          git checkout main
          git fetch upstream
          git merge upstream/main
          # Resolve conflicts in the highlighted files
          git commit -m "chore(sync): resolve upstream merge conflicts"
          git push origin main
          ```
          EOF
          )

          gh issue create \
            --title "⚠️ [Upstream Sync] Conflict detected on $(date +'%Y-%m-%d %H:%M UTC')" \
            --body "$ALERT_BODY" \
            --label "upstream-sync" || true

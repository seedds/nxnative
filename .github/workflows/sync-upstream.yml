name: Sync Upstream (seedds/nxnative)

on:
  schedule:
    # Sincroniza automaticamente a cada 12 horas (00:00 e 12:00 UTC)
    - cron: '0 0,12 * * *'
  # Permite disparar manualmente pela aba Actions do GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular merge sem enviar (Dry Run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sincronizar com seedds/nxnative
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar Remoto Upstream
        run: |
          git remote add upstream https://github.com/seedds/nxnative.git || git remote set-url upstream https://github.com/seedds/nxnative.git
          git fetch upstream main

      - name: Verificar Novos Commits do Upstream
        id: check_diff
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Commits novos no upstream: $BEHIND"
          if [ "$BEHIND" -gt 0 ]; then
            echo "Últimos commits do upstream a serem incorporados:"
            git log HEAD..upstream/main --oneline -n 10
          else
            echo "O fork já está completamente atualizado com upstream/main."
          fi

      - name: Executar Mesclagem Segura (Preservando Customizações)
        id: do_merge
        if: steps.check_diff.outputs.behind > 0
        run: |
          echo "Tentando mesclar upstream/main na branch main..."
          # Tenta o merge padrão preservando os commits locais do launcher
          if git merge upstream/main --no-edit -m "chore(sync): merge upstream updates from seedds/nxnative"; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "✅ Mesclagem concluída com sucesso sem conflitos!"
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "⚠️ Conflito de mesclagem detectado!"
            # Aborta imediatamente para NÃO corromper nem quebrar a branch main
            git merge --abort
          fi

      - name: Enviar Atualizações para a Main
        if: steps.check_diff.outputs.behind > 0 && steps.do_merge.outputs.has_conflicts == 'false' && (!inputs.dry_run)
        run: |
          echo "Enviando novos commits mesclados para a branch main do fork..."
          git push origin main
          echo "🎉 Fork atualizado com sucesso!"

      - name: Alertar Conflito com Segurança (Sem Quebrar a Main)
        if: steps.check_diff.outputs.behind > 0 && steps.do_merge.outputs.has_conflicts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="upstream-sync-review-${{ github.run_id }}"
          echo "Criando branch de resolução isolada: $BRANCH_NAME..."
          git checkout -b "$BRANCH_NAME"
          # Faz a tentativa na branch isolada para registrar onde estão os conflitos
          git merge upstream/main --no-edit || true
          git push origin "$BRANCH_NAME" || true

          ALERT_BODY=$(cat <<'EOF'
          ## ⚠️ Conflito Detectado na Sincronização Automática com o Upstream

          A ação automatizada tentou sincronizar os novos commits de `seedds/nxnative:main`, mas detectou **conflitos de mesclagem** com arquivos modificados no **NxNative Launcher**.

          > [!IMPORTANT]
          > **A sua branch `main` foi protegida e NÃO foi alterada nem corrompida.** Suas funcionalidades continuam intactas.

          Uma branch de trabalho temporária foi criada: `${{ env.BRANCH_NAME }}`.

          ### Como resolver manualmente no seu terminal local:
          ```bash
          cd nxnative
          git checkout main
          git fetch upstream
          git merge upstream/main
          # Resolva os conflitos nos arquivos indicados
          git commit -m "chore(sync): resolve upstream merge conflicts"
          git push origin main
          ```
          EOF
          )

          gh issue create \
            --title "⚠️ [Sincronização Upstream] Conflito detectado em $(date +'%d/%m/%Y %H:%M UTC')" \
            --body "$ALERT_BODY" \
            --label "upstream-sync" || true

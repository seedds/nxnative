# Version-independent cheats for nxnative (scripts/cheat_anchor.py, format 1).
# Compile it for a build with
#   cheat_anchor.py compile <this file> --nso <that build's ExeFS/main> -o <cheats folder>
# Live cheats by XIIYAZ (https://github.com/XIIYAZ), for build E0F3CCFAF50065AE (update v131072). Every value cheat writes two
# places: the save image (heap+0x5A4DA5D8 + the entry's offset in progress.sav; the game reads it only when an area loads, so
# the value survives the next save) and the live game data, so it shows at once: int records of 40 bytes (value +0x1C, copy
# +0x20) from heap+0x7F374AC8, bool records of 24 bytes (+0x16, +0x17) from heap+0x7F31F418, bottle enum records of 56 bytes
# from heap+0x7F398638, and the list of pending changes (12-byte value / name hash / flags entries from heap+0x7F380F80) that
# reads take before the records. Live writes run only while the live hash table's rupee slot is where it was found and the
# record's fixed words match. The heap addresses are this build's, so the value cheats compile for it only.
# Hearts are Link's own (his status object writes them into the game data every frame): the health pair hooks the status
# update (main+0xBABFF0) to a cave at main+0x3C46F40 that sets max and hearts to 20 before it runs; off puts the pacibsp back.
# Several entries are over the 256 words a Switch accepts per cheat, and the health pair writes code: Mac host only.


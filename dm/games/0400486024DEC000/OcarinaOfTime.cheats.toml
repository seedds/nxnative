# Version-independent cheats for nxnative (scripts/cheat_anchor.py, format 1).
# Free camera by UserDerezzed (https://github.com/UserDerezzed).
# Compile it for a build with
#   cheat_anchor.py compile <this file> --nso <that build's ExeFS/main> -o <cheats folder>
# The free camera writes the game's code at fixed addresses and indexes its stores by register 0, so it compiles only for
# build E0F3CCFAF50065AE (update v131072). It patches code (a cave in the text's zero padding and six hooks), so it runs
# on the Mac only: the iPhone's code pages are the app's signed pages (docs/reference/cheats.md).

format = 1
title = "0400486024DEC000"
authored = "E0F3CCFAF50065AE"

[[cheats]]
name = "Free camera by UserDerezzed: left stick flies, right stick looks, ZR / ZL rise and sink, R held for speed"
label = true

[[cheats]]
name = "Free camera - on"
note = "By UserDerezzed. A code cave at main+0x3C46C00 (the zero padding after the text) replaces the camera pose that the camera component's apply (main+0x4C48C0) stores at main+0x4C4E50 with the cave's own position, target and an up of (0, 1, 0); the five nn::hid::GetNpadStates calls of the game's controller reader (main+0x34693D0) go through wrappers at main+0x3C46D00 that, while it is on, keep player 1's sticks as floats at main+0x4E9FF00 and clear buttons and sticks. Controls: left stick flies along the view, right stick turns and tilts (up to about 75 degrees), both by how far they are pushed; ZR / ZL rise and sink; R held is 4 times as fast. Mac only (code writes)"

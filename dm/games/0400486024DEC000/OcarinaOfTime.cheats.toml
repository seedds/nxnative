# Version-independent cheats for nxnative (scripts/cheat_anchor.py, format 1).
# Imported from E0F3CCFAF50065AE.txt on 2026-11-07 with the code of build E0F3CCFAF50065AE. Compile it for a build with
#   cheat_anchor.py compile <this file> --nso <that build's ExeFS/main> -o <cheats folder>
# This source has no anchors, so its entries compile only for build E0F3CCFAF50065AE (update v131072): heap addresses
# cannot be anchored, and the code patches at the end keep their stubs in the padding after the text and their switch
# words in unused .bss, at this build's offsets (cheat_anchor.py import keeps them for this build only for those reasons).
#
# The codes are rainbowkittypaw's, posted on GBAtemp on 2026-11-06 for the Lichii emulator:
#   https://gbatemp.net/threads/cheat-codes-ams-and-sx-os-add-and-request.520293/page-3738#post-10942642
# Each sets one of the game's s32 game-data flags to 9999. This host keeps those flags 0x2000 bytes higher in the heap
# than Lichii does, so every address here is the post's plus 0x2000, and each write is gated on the flag's hash being in
# its slot of the game-data table (README.md, "Cheats").
# The hearts entry after them is not from the post: it was found from the same table (flag 963 is current health, 964
# max health, both in quarter hearts) and tested here. The speed and damage entries at the end are code patches found
# on this host (README.md, "Cheats"); the three speed call sites are the ones afiaka87's oots2-release
# "faster-movement-extra" doubles (MIT, https://github.com/afiaka87/oots2-release).


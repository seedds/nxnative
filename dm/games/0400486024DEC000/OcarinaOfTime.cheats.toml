# Version-independent cheats for nxnative (scripts/cheat_anchor.py, format 1).
# Map select by UserDerezzed (https://github.com/UserDerezzed).
# Compile it for a build with
#   cheat_anchor.py compile <this file> --nso <that build's ExeFS/main> -o <cheats folder>
# The locations read and write the game data through [main+0x4E842A8] and keep their state in the unused end of main's
# .bss (main+0x4E9FF10-0x4E9FFFF), with stores indexed by register 0, so everything here compiles only for build
# E0F3CCFAF50065AE (update v131072). The locations write no code; Instant warp patches code (a cave in the text's zero
# padding and one hook), so it runs on the Mac only: the iPhone's code pages are the app's signed pages.

format = 1
title = "0400486024DEC000"
authored = "E0F3CCFAF50065AE"


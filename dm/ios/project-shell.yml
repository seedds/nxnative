# Route C shell project (docs/launcher-c-plan.md M2/M3): one app that hosts the engine and every game the player added, each game's
# code and per-game files in its own framework (build_ipa.sh DM_FRAMEWORK_ONLY), the library and settings from the frontend-ios Swift
# package. dm/ios/tools/build_shell.sh copies this template to the shell's project folder, puts the frameworks in at the FRAMEWORKS line and
# runs xcodegen there. The one-game projects (project.yml, project-framework.yml) are untouched.
# Why here and linked this way: the host is compiled from dm/host's Makefile per build (Gen/src, gen_build.py), as in the one-game
# app, and its glue (Shell/) calls the engine's internals, so the project and its build script sit beside build_ipa.sh. The views have
# no engine dependency and stay a Swift package in frontend-ios/, linked as a local package by its absolute path (DM_SHELL_PACKAGE),
# so the demo app and the package tests build them without the engine.
name: DmShell
options:
  bundleIdPrefix: ${DM_BUNDLE_ID}
  deploymentTarget:
    iOS: "26.0"
configFiles:     # build_shell.sh: the host's header paths, defines and frameworks from dm/host/Makefile (gen_build.py)
  Release: Gen/dm.xcconfig
  Debug: Gen/dm.xcconfig
packages:
  ShellUI:
    path: ${DM_SHELL_PACKAGE}
targets:
  DmShell:
    type: application
    platform: iOS
    sources:
      - path: Shell           # the shell's main, its scene, the library and the real GameLauncher (dm/ios/Shell)
      - path: Sources/front_ios.m   # the game view, unchanged from the one-game app; ShellMain.m provides what it takes from main.m
      - path: Sources/DmGamepad.m
      - path: Sources/CloudSaves.m
      - path: Sources/SaveSync.m
      - path: Sources/DataBookmark.m
      - path: Gen/dm          # the host's shared files (dm/font for DM_FONT_DIR); every game's tables are in its framework
        type: folder
        buildPhase: resources
      - path: Gen/Assets.xcassets
      - path: ${DM_SHELL_PACKAGE}/AppIcon.icon   # the app icon, an Icon Composer document, shared with the demo app
      - path: Gen/src
      - path: Gen/main/main.c
        compilerFlags: "-Dmain=dm_main"
    dependencies:
      - package: ShellUI
        product: ShellUI
      - package: ShellUI
        product: ShellControllers
      - package: ShellUI
        product: ShellHost
      # @FRAMEWORKS@ (build_shell.sh: one "- framework: <path>" entry per game, embedded and signed with the app, not linked: the shell dlopens the chosen one)
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: ${DM_SHELL_NAME}
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true          # Documents (log.txt, shell-log.txt, games/<id>/) visible in the Files app
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:   # the library turns, the game view asks for landscape (front_ios.m, dm_shell_present_game)
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        LSApplicationCategoryType: public.app-category.games
        DMShowFPS: false
        LSSupportsGameMode: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${DM_BUNDLE_ID}
      PRODUCT_NAME: DmShell
      PRODUCT_MODULE_NAME: DmShell   # ShellMain.m imports DmShell-Swift.h
      MARKETING_VERSION: ${DM_APP_VERSION}
      CURRENT_PROJECT_VERSION: ${DM_APP_VERSION}
      DEVELOPMENT_TEAM: ${DM_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      # No SYMROOT / OBJROOT of its own (project.yml has them): Swift packages need Xcode's own build locations. Products go to the
      # derived data xcodebuild is given (-derivedDataPath; build_shell.sh, the Mac launcher)
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_BITCODE: NO
      STRIP_BITCODE_FROM_COPIED_FILES: NO   # the embed phase would run bitcode_strip on every Mach-O file in a framework, the pipeline archive's GPU binaries (pso/*.mtl4a) too, and fail
      GCC_C_LANGUAGE_STANDARD: gnu11
      OTHER_CFLAGS: $(inherited) -mcpu=apple-a18   # the host assembly's LSE atomics, as in project.yml
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
      CLANG_ENABLE_OBJC_ARC: YES
      CLANG_ENABLE_MODULES: YES
      SWIFT_VERSION: "5.0"
      SWIFT_OBJC_BRIDGING_HEADER: Shell/Shell-Bridging-Header.h
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_WARN_INHIBIT_ALL_WARNINGS: YES
schemes:
  DmShell:
    build:
      targets:
        DmShell: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release

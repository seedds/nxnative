<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0C11"/>
      <stop offset="50%" stop-color="#14151E"/>
      <stop offset="100%" stop-color="#0E0F16"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="specularBorder" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Switch Neon Header Accent Line -->
    <linearGradient id="switchAccent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="25%" stop-color="#A855F7"/>
      <stop offset="60%" stop-color="#00D2FF"/>
      <stop offset="85%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Cloud Sync Highlight Glow -->
    <linearGradient id="cloudGlow" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="360" rx="20" fill="url(#canvasBg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" stroke="url(#specularBorder)" stroke-width="1.2"/>
  <rect x="0" y="356" width="1200" height="4" fill="url(#switchAccent)"/>

  <!-- Left Switch Joy-Con Dual Accents -->
  <rect x="42" y="48" width="6" height="264" rx="3" fill="#FF3B30"/>
  <rect x="52" y="48" width="6" height="264" rx="3" fill="#00D2FF"/>

  <!-- App Icon / Brand Shield Container -->
  <g transform="translate(80, 48)">
    <rect width="76" height="76" rx="18" fill="#1A1C26" stroke="url(#specularBorder)" stroke-width="1.2"/>
    <!-- Switch-style Glyphs -->
    <rect x="18" y="18" width="16" height="40" rx="8" fill="#FF3B30"/>
    <circle cx="26" cy="28" r="3.5" fill="#0B0C11"/>
    <rect x="42" y="18" width="16" height="40" rx="8" fill="#00D2FF"/>
    <circle cx="50" cy="48" r="3.5" fill="#0B0C11"/>
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="176" y="90" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#FFFFFF" letter-spacing="-0.5">NxNative Launcher</text>
  
  <!-- Version Tag -->
  <rect x="560" y="66" width="68" height="26" rx="6" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
  <text x="594" y="83" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="700" font-size="12" fill="#C4B5FD" text-anchor="middle">v1.6.1</text>

  <!-- Category Monospace Tracker -->
  <text x="178" y="116" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="700" font-size="13" fill="#00D2FF" letter-spacing="2.2">NATIVE SWITCH SUITE &amp; CONSOLE ECOSYSTEM FOR APPLE SILICON</text>
  
  <!-- Narrative Lead -->
  <text x="80" y="162" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="400" font-size="16" fill="#9E9EB2">Zero-terminal porting suite with native Metal host compilation, 60 FPS unlocking &amp; console library.</text>

  <!-- Feature Badges Deck (Row 1) -->
  <!-- 1. 60 FPS Unlocked -->
  <g transform="translate(80, 196)">
    <rect width="180" height="38" rx="10" fill="#1B1B24" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4.5" fill="#8B5CF6"/>
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="13" fill="#F1F5F9">60 FPS Unlocked</text>
  </g>

  <!-- 2. Apple MetalFX AI -->
  <g transform="translate(272, 196)">
    <rect width="180" height="38" rx="10" fill="#1B1B24" stroke="#00D2FF" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4.5" fill="#00D2FF"/>
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="13" fill="#F1F5F9">Apple MetalFX AI</text>
  </g>

  <!-- 3. Controller Remapping (Updated from Universal Gamepad) -->
  <g transform="translate(464, 196)">
    <rect width="205" height="38" rx="10" fill="#1B1B24" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4.5" fill="#10B981"/>
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="13" fill="#F1F5F9">Controller Remapping</text>
  </g>

  <!-- 4. HIGHLIGHTED: Cross Save iCloud Sync -->
  <g transform="translate(681, 194)">
    <!-- Outer Glow Box -->
    <rect x="-2" y="-2" width="248" height="42" rx="12" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="1.8" filter="url(#badgeGlow)"/>
    <rect width="244" height="38" rx="10" fill="#162032" stroke="#38BDF8" stroke-width="1.4"/>
    <!-- Cloud icon -->
    <circle cx="22" cy="19" r="4" fill="#38BDF8"/>
    <circle cx="27" cy="17" r="5" fill="#38BDF8"/>
    <circle cx="33" cy="19" r="3.5" fill="#38BDF8"/>
    <rect x="22" y="19" width="11" height="4" fill="#38BDF8"/>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="700" font-size="13" fill="#38BDF8" letter-spacing="0.2">Cross Save iCloud Sync</text>
  </g>

  <!-- 5. Dual Mac & iOS Deploy -->
  <g transform="translate(937, 196)">
    <rect width="180" height="38" rx="10" fill="#1B1B24" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4.5" fill="#F59E0B"/>
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="13" fill="#F1F5F9">Dual Mac &amp; iOS</text>
  </g>

  <!-- Footer Specification Bar -->
  <g transform="translate(80, 290)">
    <rect width="1040" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', monospace" font-size="13" fill="#64748B">macOS 13+ (Ventura / Sonoma / Sequoia)  •  Apple Silicon (M1–M4)  •  Atmosphere LayeredFS Mods  •  Swift 5.9+</text>
  </g>
</svg>